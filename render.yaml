services:
  - type: web
    name: propsense-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: .
      - key: OPENAI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: propsense
      - key: COHERE_API_KEY
        sync: false
      - key: API_BEARER_TOKEN
        sync: false
      - key: MAX_DAILY_LLM_CALLS
        value: "200"
